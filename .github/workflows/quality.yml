name: Qualità

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Sintassi e regressioni
        run: node tools/check.js
      - name: Determinismo e invarianti nelle nove arene
        run: node tools/test-engine.js 40
      - name: Partite casuali e casi limite
        run: node tools/fuzz.js 1500
      - name: Build e output distribuiti aggiornati
        run: |
          node tools/build.js
          git diff --exit-code -- dist docs
          test -z "$(git ls-files --others --exclude-standard dist docs)"
